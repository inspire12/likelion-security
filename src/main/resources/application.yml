
spring:
  application:
    name: likelion-security
  security:
    user:
      password: likelion
      name: likelion
      roles: USER
  mvc:
    pathmatch:
      matching-strategy: ant_path_matcher

  thymeleaf:
    cache: false

  data:
    redis:
      host: localhost
      port: 6379
  session:
    redis:
      repository-type: indexed

server:
  servlet:
    session:
      timeout: 10m
      cookie:
        name: JSESSIONID
  port: 8085
logging:
  level:
    org.springframework.security: debug
