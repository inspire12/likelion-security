<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>로그인</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 400px;
            margin: 50px auto;
            padding: 2rem;
            border: 1px solid #ccc;
            border-radius: 10px;
            box-shadow: 2px 2px 12px rgba(0, 0, 0, 0.1);
        }

        h2 {
            text-align: center;
            margin-bottom: 2rem;
        }

        label {
            display: block;
            margin-top: 1rem;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 0.5rem;
            margin-top: 0.3rem;
            box-sizing: border-box;
        }

        .btn-group {
            margin-top: 2rem;
            display: flex;
            justify-content: space-between;
            gap: 0.5rem;
        }

        button, a.button {
            flex: 1;
            padding: 0.6rem 0;
            background-color: #007bff;
            border: none;
            border-radius: 5px;
            color: white;
            text-align: center;
            text-decoration: none;
            cursor: pointer;
        }

        a.button.secondary {
            background-color: #6c757d;
        }

        button:hover, a.button:hover {
            opacity: 0.9;
        }

        .message {
            margin-top: 1rem;
            text-align: center;
            color: red;
        }

        .message.success {
            color: green;
        }
    </style>
</head>
<body>

<h2>로그인</h2>

<form th:action="@{/security/login}" method="post">
    <label for="username">아이디</label>
    <input type="text" id="username" name="username" required/>

    <label for="password">비밀번호</label>
    <input type="password" id="password" name="password" required/>

    <div class="btn-group">
        <button type="submit">로그인</button>
        <a th:href="@{/password/reset}" class="button secondary">비밀번호 찾기</a>
        <a th:href="@{/signup}" class="button secondary">회원가입</a>
    </div>
</form>

<div class="message" th:if="${param.error}">
    아이디 또는 비밀번호가 잘못되었습니다.
</div>

<div class="message success" th:if="${param.logout}">
    정상적으로 로그아웃되었습니다.
</div>

<script th:inline="javascript">
  /*<![CDATA[*/
  const hasError = [[${param.error != null}]];
  if (hasError) {
    const goSignup = confirm("로그인에 실패했습니다.\n회원가입하시겠습니까?");
    if (goSignup) {
      window.location.href = "/signup";
    }
  }
  /*]]>*/
</script>

</body>
</html>
