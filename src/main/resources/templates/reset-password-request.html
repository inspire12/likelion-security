<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>비밀번호 재설정</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 400px;
            margin: 50px auto;
            padding: 2rem;
            border: 1px solid #ccc;
            border-radius: 10px;
            box-shadow: 2px 2px 12px rgba(0,0,0,0.1);
        }
        h2 {
            text-align: center;
            margin-bottom: 2rem;
        }
        label {
            display: block;
            margin-top: 1rem;
            font-weight: bold;
        }
        input {
            width: 100%;
            padding: 0.5rem;
            margin-top: 0.3rem;
            box-sizing: border-box;
        }
        button {
            margin-top: 2rem;
            width: 100%;
            padding: 0.7rem;
            background-color: #28a745;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
        button:hover {
            background-color: #218838;
        }
        .message {
            margin-top: 1rem;
            text-align: center;
        }
    </style>
</head>
<body>

<h2>비밀번호 재설정</h2>

<form th:action="@{/security/password/reset}" method="post">
    <label for="email">이메일 주소</label>
    <input type="email" id="email" name="email" required />

    <button type="submit">재설정 링크 전송</button>
</form>

<div class="message" th:if="${param.success}">
    이메일로 비밀번호 재설정 링크를 보냈습니다.
</div>

<div class="message" th:if="${param.error}">
    해당 이메일의 사용자를 찾을 수 없습니다.
</div>

</body>
</html>
