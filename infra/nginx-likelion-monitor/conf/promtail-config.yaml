server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml  # 로그 수집 위치 저장용 파일

clients:
  - url: http://loki:3100/loki/api/v1/push  # Loki 주소 (docker-compose 서비스 이름으로 연결)

scrape_configs:
  - job_name: nginx-logs
    static_configs:
      - targets:
          - host.docker.internal
        labels:
          job: nginx
          host: your-hostname
          __path__: /var/log/nginx/*.log
